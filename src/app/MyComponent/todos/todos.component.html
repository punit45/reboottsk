
<div>
    <app-add-todo (todoAdd)="addTodo($event)"></app-add-todo>
</div>
<div class="center" style="display: flex; justify-content: center;">
    <h4 class="display-6"> Your Current TODO List</h4> 
</div>

<div class="container">
    <div *ngIf="this.todos.length===0; else elseBlock">No Todo List</div>
    <ng-template #elseBlock>
    <div class *ngFor ="let todo of todos">
        <app-todo-item [todo] = "todo" (todoDelete)="deleteTodo($event)" (todoCheckbox)="toggleTodo($event)"></app-todo-item>
    </div>
    </ng-template>
</div>
